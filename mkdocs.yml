site_name: BetterPunish Documentation
site_description: Public documentation for the BetterPunish moderation plugin for Paper servers.
site_url: https://pamife.github.io/BetterPunish-Docs/
repo_url: https://github.com/pamife/BetterPunish-Docs
repo_name: pamife/BetterPunish-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Reference:
      - Commands: reference/commands.md
      - Permissions: reference/permissions.md
  - Punishments:
      - Overview: punishments/overview.md
      - Offense system: punishments/offense-system.md
      - Editing and evidence: punishments/editing-and-evidence.md
      - Dashboard: punishments/dashboard.md
  - Moderation:
      - Reports: moderation/reports.md
      - Freeze and staff notes: moderation/freeze-and-notes.md
      - Player information and investigation: moderation/player-info-and-investigation.md
  - Chat:
      - Protection and review: chat/protection-and-review.md
  - Logging:
      - Commands and private messages: logging/commands-and-messages.md
  - Integrations:
      - Supabase: integrations/supabase.md
      - Discord and LuckPerms: integrations/discord-and-luckperms.md
  - Administration:
      - Storage and migration: administration/storage-and-migration.md
      - Troubleshooting: administration/troubleshooting.md
